name: Vetro picker acceptance
on:
  push:
    branches: [compat/stock-vetro-0.5.0]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  picker:
    runs-on: macos-latest
    timeout-minutes: 10
    outputs:
      failure: ${{ steps.picker.outputs.failure }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - run: dev/new-local-key.sh
      - id: picker
        run: node dev/ui-vetro-test.js
  result:
    if: always()
    needs: picker
    runs-on: ubuntu-latest
    name: "Picker result: ${{ needs.picker.outputs.failure || needs.picker.result }}"
    steps:
      - run: echo "Picker acceptance result recorded"
